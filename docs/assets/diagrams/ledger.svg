<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">Tamper-evident ledger (preview)</title>
  <desc id="d">Each line of trace.jsonl is sealed into a numbered block that holds the line's SHA-256 hash and the digest of the block before it. One digest of the newest block is published as an anchor somewhere the agent cannot write. agent-latch-runtime verify returns one verdict: intact, unanchored, tampered, deleted, rewritten or missing.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .head { font-family: Syne, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-weight: 800; }
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="900" height="440" rx="16"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#F5C542"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="440" fill="#17161C"/>
    <rect width="900" height="44" fill="#121211"/>
    <line x1="0" y1="44" x2="900" y2="44" stroke="#ECE9E2" stroke-opacity=".1"/>
    <text x="24" y="27" class="mono" font-size="11" letter-spacing="1.8" fill="#ECE9E2" fill-opacity=".55">FIG. 05 — TAMPER-EVIDENT LEDGER (PREVIEW)</text>
    <circle cx="640" cy="23" r="4" fill="#7C3AED"/>
    <text x="652" y="27" class="mono" font-size="10" letter-spacing="1.2" fill="#ECE9E2" fill-opacity=".55">LOCAL CHAIN</text>
    <circle cx="766" cy="23" r="4" fill="#F5C542"/>
    <text x="778" y="27" class="mono" font-size="10" letter-spacing="1.2" fill="#ECE9E2" fill-opacity=".55">OFF-BOX ANCHOR</text>

    <!-- seal -->
    <text x="24" y="76" class="mono" font-size="10.5" letter-spacing="1.4" fill="#A78BFA">1 · SEAL EVERY RECORD</text>
    <g text-anchor="middle">
      <rect x="20" y="92" width="150" height="92" rx="12" fill="#1F1D26" stroke="#ECE9E2" stroke-opacity=".25"/>
      <text x="95" y="124" class="head" font-size="13" fill="#ECE9E2">trace.jsonl</text>
      <text x="95" y="146" class="mono" font-size="9.5" fill="#9C9A93">one line per</text>
      <text x="95" y="161" class="mono" font-size="9.5" fill="#9C9A93">MCP message</text>

      <rect x="250" y="92" width="130" height="92" rx="12" fill="#1F1D26" stroke="#7C3AED" stroke-opacity=".9" stroke-width="1.5"/>
      <text x="315" y="120" class="head" font-size="13" fill="#ECE9E2">block #1</text>
      <text x="315" y="142" class="mono" font-size="9" fill="#9C9A93">sha256(line 1)</text>
      <text x="315" y="158" class="mono" font-size="9" fill="#A78BFA">prev = genesis</text>

      <rect x="420" y="92" width="130" height="92" rx="12" fill="#1F1D26" stroke="#7C3AED" stroke-opacity=".9" stroke-width="1.5"/>
      <text x="485" y="120" class="head" font-size="13" fill="#ECE9E2">block #2</text>
      <text x="485" y="142" class="mono" font-size="9" fill="#9C9A93">sha256(line 2)</text>
      <text x="485" y="158" class="mono" font-size="9" fill="#A78BFA">prev = #1</text>

      <rect x="590" y="92" width="130" height="92" rx="12" fill="#1F1D26" stroke="#7C3AED" stroke-opacity=".9" stroke-width="1.5"/>
      <text x="655" y="120" class="head" font-size="13" fill="#ECE9E2">block #3 …</text>
      <text x="655" y="142" class="mono" font-size="9" fill="#9C9A93">sha256(line 3)</text>
      <text x="655" y="158" class="mono" font-size="9" fill="#A78BFA">prev = #2</text>

      <rect x="760" y="92" width="120" height="92" rx="12" fill="#1F1D26" stroke="#F5C542" stroke-opacity=".7" stroke-dasharray="4 5"/>
      <text x="820" y="120" class="head" font-size="13" fill="#ECE9E2">Anchor</text>
      <text x="820" y="142" class="mono" font-size="9" fill="#9C9A93">digest of the</text>
      <text x="820" y="157" class="mono" font-size="9" fill="#F5C542">newest block</text>
    </g>
    <g stroke="#7C3AED" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <path class="flow" d="M170 138 H248"/>
      <path class="flow" d="M380 138 H418"/>
      <path class="flow" d="M550 138 H588"/>
    </g>
    <path class="flow" d="M720 138 H758" stroke="#F5C542" stroke-width="1.5" fill="none" marker-end="url(#arrowY)"/>
    <g text-anchor="middle" class="mono" font-size="9" fill="#9C9A93">
      <text x="209" y="128">seal</text>
      <text x="399" y="128">link</text>
      <text x="569" y="128">link</text>
      <text x="739" y="128">publish</text>
    </g>
    <text x="820" y="204" text-anchor="middle" class="mono" font-size="9" fill="#F5C542">somewhere the agent</text>
    <text x="820" y="218" text-anchor="middle" class="mono" font-size="9" fill="#F5C542">cannot write</text>

    <!-- verify -->
    <text x="24" y="250" class="mono" font-size="10.5" letter-spacing="1.4" fill="#A78BFA">2 · VERIFY ANY TIME: agent-latch-runtime verify</text>
    <g text-anchor="middle">
      <rect x="25" y="268" width="130" height="86" rx="12" fill="#1F1D26" stroke="#3FB67D" stroke-opacity=".8"/>
      <text x="90" y="298" class="head" font-size="12" fill="#3FB67D">INTACT</text>
      <text x="90" y="320" class="mono" font-size="9" fill="#9C9A93">chain ok and the</text>
      <text x="90" y="334" class="mono" font-size="9" fill="#9C9A93">anchor matches</text>

      <rect x="169" y="268" width="130" height="86" rx="12" fill="#1F1D26" stroke="#F5C542" stroke-opacity=".8"/>
      <text x="234" y="298" class="head" font-size="12" fill="#F5C542">UNANCHORED</text>
      <text x="234" y="320" class="mono" font-size="9" fill="#9C9A93">chain ok, no anchor</text>
      <text x="234" y="334" class="mono" font-size="9" fill="#9C9A93">to prove it</text>

      <rect x="313" y="268" width="130" height="86" rx="12" fill="#1F1D26" stroke="#F0524F" stroke-opacity=".8"/>
      <text x="378" y="298" class="head" font-size="12" fill="#F0524F">TAMPERED</text>
      <text x="378" y="320" class="mono" font-size="9" fill="#9C9A93">a record was</text>
      <text x="378" y="334" class="mono" font-size="9" fill="#9C9A93">edited</text>

      <rect x="457" y="268" width="130" height="86" rx="12" fill="#1F1D26" stroke="#F0524F" stroke-opacity=".8"/>
      <text x="522" y="298" class="head" font-size="12" fill="#F0524F">DELETED</text>
      <text x="522" y="320" class="mono" font-size="9" fill="#9C9A93">records are</text>
      <text x="522" y="334" class="mono" font-size="9" fill="#9C9A93">missing</text>

      <rect x="601" y="268" width="130" height="86" rx="12" fill="#1F1D26" stroke="#F0524F" stroke-opacity=".8"/>
      <text x="666" y="298" class="head" font-size="12" fill="#F0524F">REWRITTEN</text>
      <text x="666" y="320" class="mono" font-size="9" fill="#9C9A93">whole chain rebuilt,</text>
      <text x="666" y="334" class="mono" font-size="9" fill="#9C9A93">anchor disagrees</text>

      <rect x="745" y="268" width="130" height="86" rx="12" fill="#1F1D26" stroke="#ECE9E2" stroke-opacity=".3"/>
      <text x="810" y="298" class="head" font-size="12" fill="#9C9A93">MISSING</text>
      <text x="810" y="320" class="mono" font-size="9" fill="#9C9A93">no ledger to</text>
      <text x="810" y="334" class="mono" font-size="9" fill="#9C9A93">verify</text>
    </g>

    <text x="450" y="392" text-anchor="middle" class="mono" font-size="11" fill="#F5C542">Tamper-evident, not tamper-proof: edits become visible, they are not prevented.</text>
    <text x="450" y="414" text-anchor="middle" class="mono" font-size="10" fill="#ECE9E2" fill-opacity=".5">A failed trail exits 1, even with --fail-on none.</text>
  </g>
  <rect x=".5" y=".5" width="899" height="439" rx="16" fill="none" stroke="#ECE9E2" stroke-opacity=".12"/>
</svg>
