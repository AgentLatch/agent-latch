[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-latch"
version = "0.2.0"
description = "Local-first AI agent security scanner: checks agent code, tool manifests, and prompts for prompt injection, over-privileged tools, and secrets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentLatch contributors" }]
keywords = [
  "AI agent security",
  "AI agent security scanner",
  "agentic AI security",
  "LLM security",
  "prompt injection",
  "indirect prompt injection",
  "LangChain",
  "LangGraph",
  "CrewAI",
  "static analysis",
  "OWASP Agentic Top 10",
  "dependency audit",
  "SARIF",
  "GitHub Action",
  "pre-commit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = ["rich>=13.9,<15", "rich-argparse>=1.5,<2", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/AgentLatch/agent-latch"
Repository = "https://github.com/AgentLatch/agent-latch"
Issues = "https://github.com/AgentLatch/agent-latch/issues"

[project.scripts]
agent-latch = "agent_latch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
audit = ["pip-audit>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
