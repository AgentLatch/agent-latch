[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-latch"
version = "0.1.0"
description = "Local-first AI agent security scanner for selected source and dependency risks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentLatch contributors" }]
keywords = [
  "AI agent security",
  "AI security scanner",
  "agentic AI security",
  "static analysis",
  "OWASP Agentic Top 10",
  "dependency audit",
  "SARIF",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = ["rich>=13.9,<15"]

[project.scripts]
agent-latch = "agent_latch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
audit = ["pip-audit>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
