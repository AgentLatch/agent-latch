name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests & lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AgentLatch with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest
      - name: Prove the operating system keeps a second user out of the audit store
        # Creates a real second user. The test runs as this user's opposite: the store belongs to
        # the runner, and the other user's open, chmod, delete and anchor-write must all be denied.
        env:
          AGENTLATCH_SECOND_USER: agentlatch-agent
          AGENTLATCH_REQUIRE_SECOND_USER: "1"
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin "$AGENTLATCH_SECOND_USER"
          python -m pytest tests/test_audit_store.py -k second_os_user -v
      - name: Lint with ruff
        run: ruff check .

  runtime:
    name: Runtime proxy tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AgentLatch with the runtime extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,runtime]"
      - name: Run runtime tests
        run: python -m pytest tests/test_runtime.py tests/test_runtime_middleware.py tests/test_audit_store.py

  action-smoke-test:
    name: GitHub Action smoke test (vulnerable demo)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Scan the deliberately insecure example with the local action
        id: scan
        uses: ./
        with:
          path: examples/vulnerable-agent
          fail-on: none
          upload-sarif: "false"
      - name: Check action outputs
        env:
          FINDINGS: ${{ steps.scan.outputs.finding-count }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
        run: |
          test "$FINDINGS" -gt 0
          grep -q '"uri": "examples/vulnerable-agent/agent-manifest.yaml"' "$SARIF"

  self-scan:
    name: Self-scan (AgentLatch on its own code)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Scan this repository, failing on high-severity findings
        uses: ./
        with:
          path: .
          fail-on: high
          project-ignores: "true"
          upload-sarif: "false"
