name: Publish to PyPI

# Publishes with PyPI Trusted Publishing (OIDC), so no API token is stored.
# Register this workflow as a trusted publisher on pypi.org and test.pypi.org:
#   owner AgentLatch, repository agent-latch, workflow publish.yml,
#   environment pypi (PyPI) or testpypi (TestPyPI).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish a manual run"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  # Dry run on pull requests that change how a release is built or handed to the publisher, so a
  # bump of an action used here (Dependabot) is tested before a release depends on it. A pull
  # request builds, uploads and downloads the distributions but never publishes: the publish job
  # below must keep its `pull_request` guard.
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pyproject=$(python -I -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          package=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/agent_latch/__init__.py)
          echo "tag=$TAG pyproject=$pyproject __init__=$package"
          test "$TAG" = "v$pyproject" && test "$pyproject" = "$package"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/agent-latch --version
          /tmp/smoke/bin/agent-latch scan examples/vulnerable-agent --plain --fail-on none
          /tmp/smoke/bin/agent-latch-runtime --help
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  # Pull requests only: take the same steps the publish job takes before uploading, and check
  # that the files that arrive are the ones the build produced. Nothing is published.
  verify-handoff:
    name: Check the download step (dry run, no publish)
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check the downloaded distributions
        run: |
          set -eu
          ls -l dist/
          test -n "$(ls dist/*.whl 2>/dev/null)"
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"
          python3 -m pip install --user twine
          python3 -m twine check --strict dist/*

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
    # Never publish from a pull request.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
      url: https://${{ (github.event_name == 'release' || inputs.repository == 'pypi') && 'pypi.org' || 'test.pypi.org' }}/project/agentlatch-security/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
