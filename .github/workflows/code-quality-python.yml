name: Code quality (Python)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AgentLatch with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check --output-format=github .

  ruff-format:
    name: Ruff format
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AgentLatch with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check formatting with ruff
        run: ruff format --check --diff .

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AgentLatch with dev and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,audit]"
      - name: Audit installed dependencies for known vulnerabilities
        run: pip-audit --skip-editable --progress-spinner off
