name: AgentLatch scan
description: Local-first security checks for AI-agent projects, with SARIF upload to GitHub code scanning.
author: AgentLatch contributors
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory or file to scan, relative to the repository root.
    default: "."
  config:
    description: Agent manifest to audit. Leave empty to auto-detect agent-manifest.yaml in the scan path.
    default: ""
  fail-on:
    description: Fail the step on findings of this severity or higher (none, low, medium, high, critical).
    default: high
  project-ignores:
    description: Apply the scanned project's own .agent-latch-ignore, pyproject excludes, and inline ignore comments. Leave "false" when scanning pull requests or code you do not control, since their authors can edit these.
    default: "false"
  min-severity:
    description: Report only findings at or above this severity (info, low, medium, high, critical). Default reports everything. Must not be above fail-on; hidden findings are counted in the summary.
    default: "info"
  dependencies:
    description: Also audit requirements*.txt with pip-audit (sends package names and versions to PyPI's advisory service).
    default: "false"
  sarif-file:
    description: Where to write the SARIF report.
    default: agent-latch.sarif
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  python-version:
    description: Python version used to run AgentLatch.
    default: "3.12"

outputs:
  sarif-file:
    description: Path to the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  finding-count:
    description: Number of findings.
    value: ${{ steps.summary.outputs.finding-count }}
  exit-code:
    description: AgentLatch exit code (0 = passed, 1 = findings at or above fail-on, 2 = scan error).
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AgentLatch
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        # Isolated venv so AgentLatch never installs into, or imports from, the scanned project.
        # -I (isolated mode): the working directory is the scanned repository, so Python must not
        # import a venv/, pip/, or other module planted there.
        python -I -m venv "$RUNNER_TEMP/agent-latch-venv"
        extra=""
        if [ "$DEPENDENCIES" = "true" ]; then extra="[audit]"; fi
        "$RUNNER_TEMP/agent-latch-venv/bin/python" -I -m pip install --quiet --disable-pip-version-check "${ACTION_PATH}${extra}"

    - name: Run AgentLatch
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        PROJECT_IGNORES: ${{ inputs.project-ignores }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        args=(scan "$SCAN_PATH" --format sarif --output "$SARIF_FILE" --fail-on "$FAIL_ON")
        if [ -n "$MIN_SEVERITY" ]; then args+=(--min-severity "$MIN_SEVERITY"); fi
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        if [ "$DEPENDENCIES" = "true" ]; then args+=(--dependencies); fi
        if [ "$PROJECT_IGNORES" = "true" ]; then args+=(--project-ignores); fi
        set +e
        "$RUNNER_TEMP/agent-latch-venv/bin/agent-latch" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"

    - name: Summarize findings
      id: summary
      if: steps.scan.outputs.exit-code != '2'
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        FAIL_ON: ${{ inputs.fail-on }}
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      # -I (isolated mode) keeps Python from importing modules out of the scanned repository.
      run: '"$RUNNER_TEMP/agent-latch-venv/bin/python" -I -m agent_latch.action_summary'

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '2'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: agent-latch

    - name: Enforce fail-on threshold
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ "$EXIT_CODE" = "2" ]; then
          echo "::error::AgentLatch could not complete the scan (see the Run AgentLatch step)."
          exit 2
        elif [ "$EXIT_CODE" != "0" ]; then
          echo "::error::AgentLatch found issues at or above '$FAIL_ON' severity."
          exit 1
        fi
